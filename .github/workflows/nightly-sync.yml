# Every night, port new upstream SVGO commits into svgo-rs in a fresh worktree, run the
# parity check and open a pull request that lists them.
name: nightly-sync

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      reuse_branch:
        description: "Open the pull request for this existing sync branch (sync/YYYY-MM-DD) without a new Muse Code turn"
        type: string
        default: ""

permissions: {}

concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # adds -o pipefail
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find new upstream commits
        id: upstream
        run: |
          git clone --quiet --filter=blob:none https://github.com/svg/svgo "$RUNNER_TEMP/svgo"
          last=$(tr -d '[:space:]' < .svgo-sync)
          git -C "$RUNNER_TEMP/svgo" log --reverse --format='%h %s' "$last..origin/HEAD" -- plugins lib > "$RUNNER_TEMP/commits.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/commits.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/commits.txt"

      - name: Install Rust, crates and the JS reference
        if: steps.upstream.outputs.count != '0'
        run: |
          rustup toolchain install stable --profile minimal
          cargo fetch --locked
          corepack enable
          (cd reference/svgo && pnpm install --frozen-lockfile)

      - name: Allow the Muse Code sandbox
        if: steps.upstream.outputs.count != '0' && inputs.reuse_branch == ''
        run: |
          # The sandbox (bubblewrap) needs unprivileged user namespaces; Ubuntu 24.04 runners restrict them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Muse Code
        if: steps.upstream.outputs.count != '0' && inputs.reuse_branch == ''
        env:
          MUSE_INSTALL_DIR: ${{ runner.temp }}/muse
          MUSE_NO_MODIFY_PATH: "1"
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | bash
          # Later steps call this public build by its path, never a muse found on PATH.
          "$MUSE_INSTALL_DIR/muse" --version

      - name: Make the worktree and the task
        if: steps.upstream.outputs.count != '0'
        id: task
        env:
          LAST: ${{ steps.upstream.outputs.last }}
          REUSE: ${{ inputs.reuse_branch }}
        run: |
          date=$(date -u +%F)
          [ -z "$REUSE" ] || date=${REUSE#sync/}
          wt="$RUNNER_TEMP/sync-$date"
          # A standalone clone, not `git worktree add`: a linked worktree's .git points outside it,
          # where the Muse Code sandbox cannot reach, so Muse could not commit.
          git clone -q --no-hardlinks . "$wt"
          if [ -n "$REUSE" ]; then
            git -C "$wt" fetch -q "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$REUSE"
            git -C "$wt" switch -q -c "sync/$date" FETCH_HEAD
          else
            git -C "$wt" switch -q -c "sync/$date"
          fi
          git -C "$wt" config user.name "github-actions[bot]"
          git -C "$wt" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          (cd "$wt/reference/svgo" && pnpm install --frozen-lockfile --offline)
          commits=$(sed 's/^/- svg\/svgo@/' "$RUNNER_TEMP/commits.txt")
          mkdir -p muse-out
          python3 - "$date" "$LAST" "$RUNNER_TEMP/svgo" "$commits" <<'PY'
          import sys
          date, last, up, commits = sys.argv[1:]
          t = open("scripts/nightly/nightly-task.md").read()
          t = t.replace("{{DATE}}", date).replace("{{LAST}}", last).replace("{{UPSTREAM}}", up).replace("{{COMMITS}}", commits)
          open("muse-out/task.md", "w").write(t)
          PY
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "wt=$wt" >> "$GITHUB_OUTPUT"

      - name: Muse Code ports the commits
        if: steps.upstream.outputs.count != '0' && inputs.reuse_branch == ''
        # Caps keep one run's token use bounded: model steps, tool output fed back, wall time.
        timeout-minutes: 40
        env:
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          WT: ${{ steps.task.outputs.wt }}
        run: |
          # The key reaches Muse on stdin only: env -u keeps it out of the environment Muse's tools inherit.
          printf '%s' "$MUSE_API_KEY" | env -u MUSE_API_KEY "$RUNNER_TEMP/muse/muse" exec --api-key-stdin \
            --json --model muse-wonder-1.0 \
            --workspace "$WT" \
            --prompt-file muse-out/task.md \
            --output-schema schemas/sync.schema.json \
            --max-model-steps 100 --max-tool-output-bytes 16000 \
            --approval-mode never --trust-workspace \
            > muse-out/events.jsonl
          node scripts/nightly/fmt-events.mjs < muse-out/events.jsonl
          python3 scripts/ci/last-result.py < muse-out/events.jsonl > muse-out/result.json
          jq -e '.status' muse-out/result.json > /dev/null

      - name: Check the port outside Muse Code
        if: steps.upstream.outputs.count != '0'
        working-directory: ${{ steps.task.outputs.wt }}
        run: |
          # The root crate and its six plugin crates (path dependencies, no workspace).
          cargo test --release --locked -p svgo-rs -p svgo-g1 -p svgo-g2 -p svgo-g3 -p svgo-rs-g4 -p svgo-g5 -p svgo-g6 > "$RUNNER_TEMP/test.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/test.log"; exit 1; }
          awk '/^test result:/ { p += $4; f += $6 } END { printf "cargo test --release: %d passed, %d failed\n", p, f }' \
            "$RUNNER_TEMP/test.log" | tee "$RUNNER_TEMP/check.txt"
          node scripts/run_js_corpus.mjs corpus parity-js
          ./target/release/svgo-rs -f corpus -o parity-rs
          python3 scripts/compare_parity.py parity-js parity-rs corpus | head -n 1 | tee -a "$RUNNER_TEMP/check.txt"
          rm -rf parity-js parity-rs

      - name: Open the pull request
        if: steps.upstream.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          WT: ${{ steps.task.outputs.wt }}
          DATE: ${{ steps.task.outputs.date }}
        run: |
          status=reused
          [ ! -f muse-out/result.json ] || status=$(jq -r .status muse-out/result.json)
          ahead=$(git -C "$WT" rev-list --count "$GITHUB_SHA..HEAD")
          if [ "$status" = failed ] || [ "$ahead" = 0 ]; then
            echo "No commits to propose (status: $status)"; exit 0
          fi
          git -C "$WT" push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "+HEAD:refs/heads/sync/$DATE"
          body="$WT/.sync/PR-$DATE.md"
          [ -f "$body" ] || [ ! -f muse-out/result.json ] || jq -r '"Ported: \(.ported | map(.sha + " " + .summary) | join("; "))\n\nParity: \(.parity)\n\nTests: \(.tests)"' muse-out/result.json > "$RUNNER_TEMP/pr.md"
          [ -f "$body" ] || [ -f "$RUNNER_TEMP/pr.md" ] ||
            git -C "$WT" log --reverse --format='- %s' "$GITHUB_SHA..HEAD" > "$RUNNER_TEMP/pr.md"
          [ -f "$body" ] || body="$RUNNER_TEMP/pr.md"
          { cat "$body"; printf '\n## Workflow check (outside Muse Code)\n\n```\n'; cat "$RUNNER_TEMP/check.txt"; printf '```\n'; } > "$RUNNER_TEMP/pr-full.md"
          body="$RUNNER_TEMP/pr-full.md"
          # A rerun on the same day replaces the branch; its open pull request picks that up.
          [ "$(gh pr list --head "sync/$DATE" --state open --json number --jq length)" != 0 ] ||
            gh pr create --head "sync/$DATE" --base main --title "Nightly sync $DATE: port upstream SVGO commits" --body-file "$body"
