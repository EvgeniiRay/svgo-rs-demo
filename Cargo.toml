[workspace]
members = ["crates/g1", "crates/g2", "crates/g3", "crates/g4", "crates/g5", "crates/g6"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[package]
name = "svgo-rs"
version.workspace = true
edition.workspace = true
description = "Rust port of SVGO 4.1.0 preset-default"
license.workspace = true
rust-version.workspace = true

[lib]
name = "svgo_rs"
path = "src/lib.rs"

[[bin]]
name = "svgo-rs"
path = "src/main.rs"

[dependencies]
g1 = { package = "svgo-g1", path = "crates/g1" }
g2 = { package = "svgo-g2", path = "crates/g2" }
g3 = { package = "svgo-g3", path = "crates/g3" }
g4 = { package = "svgo-rs-g4", path = "crates/g4" }
g5 = { package = "svgo-g5", path = "crates/g5" }
g6 = { package = "svgo-g6", path = "crates/g6" }

[profile.release]
opt-level = 3
